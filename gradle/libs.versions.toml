[versions]
# ---------------------------------------------------------------------------------------
# What pins this file, as of the 19 August 2026 upgrade.
#
# `compileSdk = 36` is the pin. Several androidx artifacts have moved to
# requiring 37, which AGP 8.x will not compile against, so each version below is the
# newest that still declares `minCompileSdk <= 36`. Read out of each artifact's
# `META-INF/com/android/build/gradle/aar-metadata.properties`, not guessed:
#
#   compose-bom 2026.06.01 -> compose 1.11.4 -> 35        2026.08.00 -> 1.12.0 -> 37
#   core-ktx    1.18.0                       -> 36        1.19.0            -> 37
#   lifecycle   2.10.0                       -> 35        2.11.0            -> 37
#   activity-compose 1.13.0                  -> 36        (newest published)
#   work        2.11.2                       -> 35        (newest published)
#   glance      1.1.1                        -> 34        1.2.0 published, minCompileSdk 35
#                                              (read off the aar — a one-line bump, unlike
#                                              the three above; taken or not, a decision)
#
# So this set is not "a bit behind", it is exactly the ceiling of the 8.x line. Moving any
# of the first three is not a version bump, it is the AGP 9 migration: compileSdk 37, and
# a major AGP release with its own breaking changes. That is one deliberate change with
# its own verification, and it wants a phone.
# ---------------------------------------------------------------------------------------

# The last of the AGP 8.x line. 9.x is available and is a major migration; see above.
agp = "8.13.2"
# Removed the `kotlinOptions` DSL in favour of `compilerOptions` — a hard error, not a
# warning. See the `kotlin { }` block in app/build.gradle.kts.
kotlin = "2.4.10"
coreKtx = "1.18.0"
work = "2.11.2"
glance = "1.1.1"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
