[versions]
# ---------------------------------------------------------------------------------------
# What pins this file, as of 19 August 2026.
#
# It used to be Kotlin. play-services-ads shipped metadata a compiler could not read, so
# the ads SDK was stuck a year behind — measured from the artifacts rather than guessed:
# ads 23.6.0 is 1.9.9999, 24.0.0-24.8.0 are 2.1.0, 25.0.0 is 2.2.0, 25.4.0 is 2.3.0,
# against a compiler pinned at 2.1.20. **That constraint is gone.** Kotlin 2.4.10 reads
# 2.3.0 without complaint and the ads SDK is current.
#
# What pins it now is `compileSdk = 36`. Several androidx artifacts have moved to
# requiring 37, which AGP 8.x will not compile against, so each version below is the
# newest that still declares `minCompileSdk <= 36`. Read out of each artifact's
# `META-INF/com/android/build/gradle/aar-metadata.properties`, not guessed:
#
#   compose-bom 2026.06.01 -> compose 1.11.4 -> 35        2026.08.00 -> 1.12.0 -> 37
#   core-ktx    1.18.0                       -> 36        1.19.0            -> 37
#   lifecycle   2.10.0                       -> 35        2.11.0            -> 37
#   activity-compose 1.13.0                  -> 36        (newest published)
#   work        2.11.2                       -> 35        (newest published)
#   glance      1.1.1                        -> 34        (newest published)
#
# So this set is not "a bit behind", it is exactly the ceiling of the 8.x line. Moving any
# of the first three is not a version bump, it is the AGP 9 migration: compileSdk 37, and
# a major AGP release with its own breaking changes. That is one deliberate change with
# its own verification, and it wants a phone — `targetSdk` stays 36 either way, because
# that is what Play requires and raising it is a separate decision with its own audit.
# ---------------------------------------------------------------------------------------

# The last of the AGP 8.x line. 9.x is available and is a major migration; see above.
agp = "8.13.2"
# Removed the `kotlinOptions` DSL in favour of `compilerOptions` — a hard error, not a
# warning. See the `kotlin { }` block in app/build.gradle.kts.
kotlin = "2.4.10"
coreKtx = "1.18.0"
work = "2.11.2"
glance = "1.1.1"
composeBom = "2026.06.01"
activityCompose = "1.13.0"
lifecycle = "2.10.0"
# Now the newest published, which is the point of the upgrade above: Google reduces fill
# for aging ad SDKs and eventually stops serving them. 25.x deprecates the anchored
# adaptive banner sizes in favour of a `getLarge*` family that returns a taller banner —
# deliberately not taken, because it moves a measured layout number. See AdBar.kt.
playAds = "25.4.0"
billing = "9.1.0"
ump = "4.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }

# Monetization. None of these are reachable from the widget or the refresh worker —
# see the "Ads" section of the README for why that separation is load-bearing.
play-services-ads = { group = "com.google.android.gms", name = "play-services-ads", version.ref = "playAds" }
# Plain, not -ktx. The ktx suspend wrappers changed shape across 7 -> 8 -> 9 while the
# listener interfaces did not, and billing is an event stream anyway — a purchase can
# arrive from PurchasesUpdatedListener with nobody having called anything.
billing = { group = "com.android.billingclient", name = "billing", version.ref = "billing" }
user-messaging-platform = { group = "com.google.android.ump", name = "user-messaging-platform", version.ref = "ump" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
