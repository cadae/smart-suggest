org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 8.7.3 was tested up to compileSdk 35, and compileSdk is 36 because Play requires
# targetSdk 36 from 31 August 2026 (see app/build.gradle.kts). Without this line every
# build prints a paragraph recommending a newer AGP.
#
# Suppressed rather than fixed, and the difference matters. The real fix is to upgrade
# AGP, which needs Gradle 8.11+ and pulls the Compose BOM and the ads SDK with it — a
# deliberate change with its own verification, not something to bundle into a
# deadline-driven target bump. What this line costs is the warning's actual content: AGP
# is parsing an android.jar newer than any it was tested against, so a build failure or
# a wrong lint result is *more* likely than usual, and this hides the hint that would
# explain it. It is here rather than left printing because a warning that appears on
# every build and has been consciously accepted teaches everyone to skim past warnings,
# which is worse than this one being invisible.
#
# Delete this line as the first step of the AGP upgrade — if the upgrade is real, the
# warning will not come back.
android.suppressUnsupportedCompileSdk=36

kotlin.code.style=official
